syntax = "proto3";

package wippy.hub.module.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/wippyai/proto-api/wippy/hub/module/v1;modulev1";

// Semantic version reference.
message VersionRef {
  oneof value {
    // Version ID.
    string id = 1 [(buf.validate.field).string.uuid = true];
    // Semantic version string (e.g., "1.0.0", "2.1.0-beta.1").
    string version = 2 [(buf.validate.field).string.max_len = 64];
    // Label reference (e.g., "latest", "stable").
    string label = 3 [(buf.validate.field).string.max_len = 32];
  }
}

// A version of a module in the hub.
message Version {
  // Unique identifier.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Module this version belongs to.
  string module_id = 2 [(buf.validate.field).string.uuid = true];
  // Semantic version string.
  string version = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // SHA-256 digest of the WAPP file.
  string digest = 4;
  // Size of the WAPP file in bytes.
  uint64 size_bytes = 5;
  // Whether this version has been yanked.
  bool yanked = 6;
  // User who published this version.
  string published_by = 7;
  // When the version was created.
  google.protobuf.Timestamp create_time = 8;
  // Module metadata extracted from WAPP.
  VersionMetadata metadata = 9;
  // Download count.
  uint64 download_count = 10;
  // Whether this version is protected (contains bytecode).
  bool protected = 11;
  // Protection type if protected.
  ProtectionType protection_type = 12;
  // Lua module names in this version.
  repeated string lua_modules = 13;
  // Entry kinds (types) in this version.
  repeated string entry_kinds = 14;
  // Total entry count.
  uint32 entry_count = 15;
  // Dependencies declared by this version.
  repeated Dependency dependencies = 16;
  // Configuration requirements.
  repeated Requirement requirements = 17;
  // Files in this version.
  repeated VersionFile files = 18;
  // README content (from ns.definition).
  string readme = 19;
  // Release notes for this version.
  string release_notes = 20;
  // Source of this version: "version" (direct publish) or "label" (from label publish).
  string source = 21;
  // If source is "label", the label name that created this version.
  string source_label = 22;
}

// Protection type for modules containing bytecode.
enum ProtectionType {
  PROTECTION_TYPE_UNSPECIFIED = 0;
  // No protection, source code available.
  PROTECTION_TYPE_NONE = 1;
  // Bytecode compiled, requires runtime to execute.
  PROTECTION_TYPE_BYTECODE = 2;
  // Encrypted content.
  PROTECTION_TYPE_ENCRYPTED = 3;
}

// Metadata extracted from WAPP file.
message VersionMetadata {
  // Module description.
  string description = 1;
  // Repository URL.
  string repository = 2;
  // License identifier (e.g., "MIT", "Apache-2.0").
  string license = 3;
  // Keywords for search.
  repeated string keywords = 4;
  // Authors.
  repeated string authors = 5;
  // Documentation URL.
  string documentation = 6;
  // Homepage URL.
  string homepage = 7;
  // Minimum Wippy version required.
  string min_wippy_version = 8;
  // README content (extracted from ns.definition).
  string readme = 9;
}

// Dependency declaration.
message Dependency {
  // Organization name.
  string org = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Module name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Version constraint (e.g., "^1.0.0", ">=2.0.0").
  string version_constraint = 3;
}

// File entry in a version.
message VersionFile {
  // File path within the module.
  string path = 1;
  // File size in bytes.
  uint64 size_bytes = 2;
}

// Label attached to a version (e.g., "latest", "stable").
message Label {
  // Label name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[a-z][a-z0-9-]*$"
  }];
  // Version ID this label points to.
  string version_id = 2 [(buf.validate.field).string.uuid = true];
  // When the label was last updated.
  google.protobuf.Timestamp update_time = 3;
  // Release notes for this label (can differ from version release notes).
  string release_notes = 4;
}

// Configuration requirement for a module.
message Requirement {
  // Requirement name (config key).
  string name = 1;
  // Description of what this requirement is for.
  string description = 2;
  // Where this requirement is used.
  repeated RequirementTarget targets = 3;
  // Default value if any.
  string default = 4;
}

// Target entry that uses a requirement.
message RequirementTarget {
  // Entry ID that uses this requirement.
  string entry = 1;
  // Path within the entry.
  string path = 2;
}
