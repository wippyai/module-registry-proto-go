syntax = "proto3";

package wippy.hub.module.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "wippy/hub/module/v1/version.proto";
import "wippy/hub/module/v1/publish_service.proto";

option go_package = "github.com/wippyai/proto-api/wippy/hub/module/v1;modulev1";

// Service for retrieving module manifests.
// Used by VP tool to resolve dependencies and get download information.
service ManifestService {
  // Get manifest for a specific module version.
  // Includes resolved dependencies and download URLs.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Resolve dependencies for a set of modules.
  // Returns a complete dependency tree with download information.
  rpc ResolveDependencies(ResolveDependenciesRequest) returns (ResolveDependenciesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Check if modules need updates.
  rpc CheckUpdates(CheckUpdatesRequest) returns (CheckUpdatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Request for module manifest.
message GetManifestRequest {
  // Module reference.
  oneof module {
    string module_id = 1 [(buf.validate.field).string.uuid = true];
    ModuleName module_name = 2;
  }
  // Version reference (specific version, label, or constraint).
  VersionRef version = 3;
}

// Response with module manifest.
message GetManifestResponse {
  // The manifest.
  ModuleManifest manifest = 1;
}

// Complete manifest for a module version.
message ModuleManifest {
  // Module information.
  ModuleInfo module = 1;
  // Version information.
  VersionInfo version = 2;
  // Direct dependencies.
  repeated ResolvedDependency dependencies = 3;
  // Download information.
  DownloadInfo download = 4;
}

// Basic module information.
message ModuleInfo {
  string id = 1;
  string org = 2;
  string name = 3;
  string description = 4;
  string license = 5;
  string repository = 6;
}

// Version information in manifest.
message VersionInfo {
  string id = 1;
  string version = 2;
  string digest = 3;
  uint64 size_bytes = 4;
  google.protobuf.Timestamp create_time = 5;
  VersionMetadata metadata = 6;
}

// Resolved dependency with download info.
message ResolvedDependency {
  // Organization.
  string org = 1;
  // Module name.
  string name = 2;
  // Resolved version.
  string version = 3;
  // Version ID.
  string version_id = 4;
  // SHA-256 digest.
  string digest = 5;
  // Download URL (pre-signed).
  string download_url = 6;
  // URL expiration.
  google.protobuf.Timestamp download_expires_at = 7;
}

// Download information.
message DownloadInfo {
  // Pre-signed download URL.
  string url = 1;
  // URL expiration time.
  google.protobuf.Timestamp expires_at = 2;
  // SHA-256 digest for verification.
  string digest = 3;
  // File size in bytes.
  uint64 size_bytes = 4;
}

// Request to resolve dependencies.
message ResolveDependenciesRequest {
  // Root modules to resolve.
  repeated DependencySpec roots = 1 [(buf.validate.field).repeated.min_items = 1];
  // Already installed modules (for incremental resolution).
  repeated InstalledModule installed = 2;
  // Resolution strategy.
  ResolutionStrategy strategy = 3;
}

// Dependency specification.
message DependencySpec {
  string org = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // Version constraint (semver range).
  string constraint = 3;
}

// Already installed module.
message InstalledModule {
  string org = 1;
  string name = 2;
  string version = 3;
  string digest = 4;
}

// Resolution strategy.
enum ResolutionStrategy {
  RESOLUTION_STRATEGY_UNSPECIFIED = 0;
  // Prefer newest compatible versions.
  RESOLUTION_STRATEGY_NEWEST = 1;
  // Prefer minimal version updates.
  RESOLUTION_STRATEGY_MINIMAL = 2;
}

// Response with resolved dependencies.
message ResolveDependenciesResponse {
  // All modules to install/update.
  repeated ResolvedModule modules = 1;
  // Resolution errors (if any).
  repeated ResolutionError errors = 2;
}

// Resolved module with full download info.
message ResolvedModule {
  string org = 1;
  string name = 2;
  string version = 3;
  string version_id = 4;
  string digest = 5;
  uint64 size_bytes = 6;
  string download_url = 7;
  google.protobuf.Timestamp download_expires_at = 8;
  // Dependencies of this module.
  repeated DependencySpec dependencies = 9;
}

// Resolution error.
message ResolutionError {
  string org = 1;
  string name = 2;
  string constraint = 3;
  string message = 4;
  string code = 5;
}

// Request to check for updates.
message CheckUpdatesRequest {
  // Currently installed modules.
  repeated InstalledModule installed = 1 [(buf.validate.field).repeated.min_items = 1];
}

// Response with available updates.
message CheckUpdatesResponse {
  // Available updates.
  repeated ModuleUpdate updates = 1;
}

// Available module update.
message ModuleUpdate {
  string org = 1;
  string name = 2;
  string current_version = 3;
  string latest_version = 4;
  // Whether this is a breaking change.
  bool breaking = 5;
  // Update summary.
  string summary = 6;
}
