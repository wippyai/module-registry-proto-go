syntax = "proto3";

package wippy.hub.module.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "wippy/hub/module/v1/version.proto";
import "wippy/hub/module/v1/publish_service.proto";

option go_package = "github.com/wippyai/proto-api/wippy/hub/module/v1;modulev1";

// Service for downloading modules.
// Downloads are tracked asynchronously for statistics.
service DownloadService {
  // Get a download URL for a module version.
  // Returns a pre-signed S3 URL valid for a limited time.
  rpc GetDownloadURL(GetDownloadURLRequest) returns (GetDownloadURLResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Get download URLs for multiple modules at once.
  // Used for batch dependency resolution.
  rpc GetBatchDownloadURLs(GetBatchDownloadURLsRequest) returns (GetBatchDownloadURLsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Get README content for a module version.
  rpc GetReadme(GetReadmeRequest) returns (GetReadmeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Request for download URL.
message GetDownloadURLRequest {
  // Module reference.
  oneof module {
    string module_id = 1 [(buf.validate.field).string.uuid = true];
    ModuleName module_name = 2;
  }
  // Version reference.
  VersionRef version = 3;
}

// Response with download URL.
message GetDownloadURLResponse {
  // Pre-signed download URL.
  string url = 1;
  // URL expiration time.
  google.protobuf.Timestamp expires_at = 2;
  // SHA-256 digest for verification.
  string digest = 3;
  // File size in bytes.
  uint64 size_bytes = 4;
  // Version information.
  string version = 5;
  // Whether the module is protected (WAPP format, not unpacked).
  bool protected = 6;
}

// Request for batch download URLs.
message GetBatchDownloadURLsRequest {
  // Modules to get download URLs for.
  repeated BatchDownloadItem items = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

// Single item in batch download request.
message BatchDownloadItem {
  string org = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // Version constraint or specific version.
  string version = 3;
}

// Response with batch download URLs.
message GetBatchDownloadURLsResponse {
  // Download URLs for each requested module.
  repeated BatchDownloadResult results = 1;
}

// Result for single item in batch download.
message BatchDownloadResult {
  string org = 1;
  string name = 2;
  // Resolved version.
  string version = 3;
  // Pre-signed download URL.
  string url = 4;
  // URL expiration.
  google.protobuf.Timestamp expires_at = 5;
  // SHA-256 digest.
  string digest = 6;
  // File size.
  uint64 size_bytes = 7;
  // Whether protected.
  bool protected = 8;
  // Error if resolution failed.
  string error = 9;
}

// Request for README.
message GetReadmeRequest {
  oneof module {
    string module_id = 1 [(buf.validate.field).string.uuid = true];
    ModuleName module_name = 2;
  }
  // Version reference (optional, defaults to latest).
  VersionRef version = 3;
}

// Response with README content.
message GetReadmeResponse {
  // README content (markdown).
  string content = 1;
  // README filename.
  string filename = 2;
  // Version this README belongs to.
  string version = 3;
}
