syntax = "proto3";

package wippy.hub.module.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "wippy/hub/module/v1/version.proto";

option go_package = "github.com/wippyai/proto-api/wippy/hub/module/v1;modulev1";

// Service for publishing modules using WAPP format.
// Publishing is asynchronous - the WAPP file is uploaded to temporary storage
// and processed by a background workflow.
service PublishService {
  // Initiate a publish operation. Returns an upload URL for the WAPP file.
  rpc InitiatePublish(InitiatePublishRequest) returns (InitiatePublishResponse) {}

  // Confirm the upload is complete and start processing.
  rpc ConfirmPublish(ConfirmPublishRequest) returns (ConfirmPublishResponse) {}

  // Get the status of a publish operation.
  rpc GetPublishStatus(GetPublishStatusRequest) returns (GetPublishStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Cancel a pending publish operation.
  rpc CancelPublish(CancelPublishRequest) returns (CancelPublishResponse) {}

  // Yank a published version (marks it as withdrawn but doesn't delete).
  rpc YankVersion(YankVersionRequest) returns (YankVersionResponse) {}
}

// Request to initiate a publish operation.
message InitiatePublishRequest {
  // Module to publish to (org/name format or module ID).
  oneof module {
    // Module ID.
    string module_id = 1 [(buf.validate.field).string.uuid = true];
    // Module name in org/name format.
    ModuleName module_name = 2;
  }
  // Version OR label - mutually exclusive.
  oneof target {
    // Semantic version to publish (immutable).
    string version = 3 [(buf.validate.field).string.max_len = 64];
    // Label to publish to (mutable, e.g., "develop", "nightly").
    // Creates auto-versioned entry like 0.0.0-{label}.{timestamp}.
    string label = 7 [(buf.validate.field).string = {
      max_len: 32
      pattern: "^[a-z][a-z0-9-]*$"
    }];
  }
  // Expected file size for validation.
  uint64 expected_size_bytes = 4;
  // SHA-256 digest of the WAPP file for verification.
  string digest = 5 [(buf.validate.field).string.len = 64];
  // Whether this is a protected module (bytecode).
  // Requires paid subscription.
  bool protected = 6;
  // Release notes for this publish (optional).
  // For label publishes, if not provided, uses previous label release notes.
  string release_notes = 8;
}

// Module name reference.
message ModuleName {
  // Organization name.
  string org = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Module name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// Response to initiate publish.
message InitiatePublishResponse {
  // Unique ID for this publish operation.
  string publish_id = 1;
  // Pre-signed URL to upload the WAPP file.
  string upload_url = 2;
  // Expiration time for the upload URL.
  google.protobuf.Timestamp upload_expires_at = 3;
}

// Request to confirm upload completion.
message ConfirmPublishRequest {
  // Publish operation ID.
  string publish_id = 1 [(buf.validate.field).string.uuid = true];
}

// Response to confirm publish.
message ConfirmPublishResponse {
  // Current status of the publish operation.
  PublishStatus status = 1;
}

// Request to get publish status.
message GetPublishStatusRequest {
  // Publish operation ID.
  string publish_id = 1 [(buf.validate.field).string.uuid = true];
}

// Response with publish status.
message GetPublishStatusResponse {
  // Current status.
  PublishStatus status = 1;
  // Detailed status information.
  PublishStatusDetails details = 2;
}

// Status of a publish operation.
enum PublishStatus {
  PUBLISH_STATUS_UNSPECIFIED = 0;
  // Waiting for WAPP upload.
  PUBLISH_STATUS_PENDING_UPLOAD = 1;
  // Upload received, processing.
  PUBLISH_STATUS_PROCESSING = 2;
  // Validation in progress.
  PUBLISH_STATUS_VALIDATING = 3;
  // Successfully published.
  PUBLISH_STATUS_COMPLETED = 4;
  // Failed with error.
  PUBLISH_STATUS_FAILED = 5;
  // Cancelled by user.
  PUBLISH_STATUS_CANCELLED = 6;
}

// Detailed status information.
message PublishStatusDetails {
  // Error message if failed.
  string error_message = 1;
  // Error code if failed.
  string error_code = 2;
  // Published version if completed.
  Version version = 3;
  // Processing stage information.
  string stage = 4;
  // Progress percentage (0-100).
  int32 progress = 5;
}

// Request to cancel a publish operation.
message CancelPublishRequest {
  // Publish operation ID.
  string publish_id = 1 [(buf.validate.field).string.uuid = true];
}

// Response to cancel publish.
message CancelPublishResponse {
  // Whether cancellation was successful.
  bool cancelled = 1;
}

// Request to yank a version.
message YankVersionRequest {
  // Module reference.
  oneof module {
    string module_id = 1 [(buf.validate.field).string.uuid = true];
    ModuleName module_name = 2;
  }
  // Version to yank.
  string version = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Reason for yanking.
  string reason = 4;
}

// Response to yank version.
message YankVersionResponse {
  // The yanked version.
  Version version = 1;
}
