syntax = "proto3";

package wippy.hub.module.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/wippyai/proto-api/wippy/hub/module/v1;modulev1";

// Reference to a module.
message ModuleRef {
  oneof value {
    // Module ID.
    string id = 1 [(buf.validate.field).string.uuid = true];
    // Module name reference (org/name).
    ModuleNameRef name_ref = 2;
  }
}

// Module name reference.
message ModuleNameRef {
  // Organization name or ID.
  string org = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Module name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// A module in the hub.
message Module {
  // Unique identifier.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Module name (unique within organization).
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9-]*$"
  }];
  // Display name for UI.
  string display_name = 3;
  // Organization ID.
  string organization_id = 4 [(buf.validate.field).string.uuid = true];
  // Organization name.
  string organization_name = 5;
  // Module description (from latest version).
  string description = 6;
  // Latest stable version.
  string latest_version = 7;
  // Total download count across all versions.
  uint64 total_downloads = 8;
  // Total favorites count.
  uint64 favorites_count = 9;
  // When the module was created.
  google.protobuf.Timestamp create_time = 10;
  // When the module was last updated.
  google.protobuf.Timestamp update_time = 11;
  // Module visibility.
  Visibility visibility = 12;
  // Whether the module is deprecated.
  bool deprecated = 13;
  // Deprecation message if deprecated.
  string deprecation_message = 14;
  // Module type.
  ModuleType type = 15;
  // Keywords for search.
  repeated string keywords = 16;
  // License identifier.
  string license = 17;
  // Repository URL.
  string repository = 18;
  // Homepage URL.
  string homepage = 19;
  // Whether the latest version is protected (bytecode).
  bool protected = 20;
  // Contracts provided by this module.
  repeated Contract contracts = 21;
  // Download statistics (last 30 days).
  repeated DownloadStat download_stats = 22;
}

// Module visibility.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // Public module, visible to everyone.
  VISIBILITY_PUBLIC = 1;
  // Private module, visible only to organization members.
  VISIBILITY_PRIVATE = 2;
  // Internal module, visible to organization and trusted partners.
  VISIBILITY_INTERNAL = 3;
}

// Module type.
enum ModuleType {
  MODULE_TYPE_UNSPECIFIED = 0;
  // Library module (provides reusable code).
  MODULE_TYPE_LIBRARY = 1;
  // Application module (executable).
  MODULE_TYPE_APPLICATION = 2;
  // Agent module (autonomous AI agent).
  MODULE_TYPE_AGENT = 3;
  // Plugin module (extension for applications or libraries).
  MODULE_TYPE_PLUGIN = 4;
}

// Organization in the hub.
message Organization {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z][a-z0-9-]*$"
  }];
  string display_name = 3;
  string description = 4;
  string avatar_url = 5;
  string website = 6;
  google.protobuf.Timestamp create_time = 7;
  // Whether organization has paid subscription (can publish protected modules).
  bool has_paid_subscription = 8;
}

// Contract provided by a module.
message Contract {
  // Contract identifier.
  string id = 1;
  // Contract name.
  string name = 2;
  // Contract description.
  string description = 3;
  // Methods in this contract.
  repeated ContractMethod methods = 4;
}

// Method in a contract.
message ContractMethod {
  // Method name.
  string name = 1;
  // Method description.
  string description = 2;
}

// Daily download statistics.
message DownloadStat {
  // Date in YYYY-MM-DD format.
  string date = 1;
  // Download count for this date.
  uint64 count = 2;
}
